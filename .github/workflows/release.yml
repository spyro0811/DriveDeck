name: Build Windows and Linux release
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: shared-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows:
    outputs:
      version: ${{ steps.version.outputs.version }}
    runs-on: windows-latest
    env:
      DRIVEDECK_RELEASE_REPOSITORY: ${{ vars.RELEASE_REPOSITORY || github.repository }}
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Locate project
        shell: pwsh
        run: |
          $project = if (Test-Path 'package.json') { '.' } elseif (Test-Path 'drivedeck/package.json') { 'drivedeck' } else { throw 'DriveDeck package.json is missing.' }
          "DD_DIR=$project" >> $env:GITHUB_ENV
      - name: Install dependencies
        working-directory: ${{ env.DD_DIR }}
        run: npm ci
      - name: Validate release version
        id: version
        working-directory: ${{ env.DD_DIR }}
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Public workflow requires a stable version.' }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") { throw 'Git tag must match package.json version.' }
          "DD_VERSION=$version" >> $env:GITHUB_ENV
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Test
        working-directory: ${{ env.DD_DIR }}
        run: npm test
      - name: Rebuild bundled BeamNG companion
        working-directory: ${{ env.DD_DIR }}
        run: python scripts/package-companion.py
      - name: Build installer and update feed
        working-directory: ${{ env.DD_DIR }}
        run: npm run release:build
      - name: Validate update artifacts
        working-directory: ${{ env.DD_DIR }}
        run: node scripts/verify-release.cjs
      - name: Save build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DriveDeck-Windows-${{ env.DD_VERSION }}
          path: |
            ${{ env.DD_DIR }}/dist/DriveDeck-Setup-*.exe
            ${{ env.DD_DIR }}/dist/DriveDeck-Setup-*.exe.blockmap
            ${{ env.DD_DIR }}/dist/latest.yml
          if-no-files-found: error
  linux:
    uses: ./.github/workflows/linux-release.yml
    with:
      build_only: true
    secrets: inherit
  draft:
    needs: [windows, linux]
    runs-on: ubuntu-24.04
    env:
      DD_VERSION: ${{ needs.windows.outputs.version }}
      DRIVEDECK_RELEASE_REPOSITORY: ${{ vars.RELEASE_REPOSITORY || github.repository }}
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: DriveDeck-*
          path: release-assets
          merge-multiple: true
      - name: Create shared Windows and Linux draft
        run: |
          tag="v$DD_VERSION"
          repo="$DRIVEDECK_RELEASE_REPOSITORY"
          notes="$RUNNER_TEMP/shared-release-notes.md"
          node -e "process.stdout.write(require('node:fs').readFileSync('./RELEASE-DOWNLOADS.md','utf8')+'\n\n'+require('./src/release-notes.json').notes+'\n\n'+require('./src/release-notes-linux.json').notes)" > "$notes"
          if gh release view "$tag" --repo "$repo" --json isDraft > "$RUNNER_TEMP/release.json" 2>/dev/null; then
            node -e "if(!require(process.env.RUNNER_TEMP+'/release.json').isDraft)process.exit(1)"
          else
            gh release create "$tag" --repo "$repo" --target "$GITHUB_SHA" --draft --title "DriveDeck $DD_VERSION" --notes-file "$notes"
          fi
          gh release edit "$tag" --repo "$repo" --notes-file "$notes"
          for file in "DriveDeck-Setup-$DD_VERSION.exe" latest.yml "DriveDeck-$DD_VERSION-x64.AppImage" latest-linux.yml; do
            test -s "release-assets/$file"
          done
          gh release upload "$tag" --repo "$repo" --clobber release-assets/*
