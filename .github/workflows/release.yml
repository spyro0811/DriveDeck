name: Build Windows release
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    env:
      DRIVEDECK_RELEASE_REPOSITORY: ${{ vars.RELEASE_REPOSITORY || github.repository }}
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Locate project
        shell: pwsh
        run: |
          $project = if (Test-Path 'package.json') { '.' } elseif (Test-Path 'drivedeck/package.json') { 'drivedeck' } else { throw 'DriveDeck package.json is missing.' }
          "DD_DIR=$project" >> $env:GITHUB_ENV
      - name: Install dependencies
        working-directory: ${{ env.DD_DIR }}
        run: npm ci
      - name: Validate release version
        working-directory: ${{ env.DD_DIR }}
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Public workflow requires a stable version.' }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") { throw 'Git tag must match package.json version.' }
          "DD_VERSION=$version" >> $env:GITHUB_ENV
      - name: Test
        working-directory: ${{ env.DD_DIR }}
        run: npm test
      - name: Rebuild bundled BeamNG companion
        working-directory: ${{ env.DD_DIR }}
        run: python scripts/package-companion.py
      - name: Build installer and update feed
        working-directory: ${{ env.DD_DIR }}
        run: npm run release:build
      - name: Validate update artifacts
        working-directory: ${{ env.DD_DIR }}
        run: node scripts/verify-release.cjs
      - name: Save build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DriveDeck-Windows-${{ env.DD_VERSION }}
          path: |
            ${{ env.DD_DIR }}/dist/DriveDeck-Setup-*.exe
            ${{ env.DD_DIR }}/dist/DriveDeck-Setup-*.exe.blockmap
            ${{ env.DD_DIR }}/dist/latest.yml
          if-no-files-found: error
      - name: Create or update draft release
        working-directory: ${{ env.DD_DIR }}
        shell: pwsh
        run: |
          $notesFile = Join-Path $env:RUNNER_TEMP 'drivedeck-release-notes.md'
          node -e "process.stdout.write(require('./src/release-notes.json').notes)" | Set-Content -Encoding utf8 $notesFile
          $tag = "v$env:DD_VERSION"
          $repo = $env:DRIVEDECK_RELEASE_REPOSITORY
          $assets = @("dist/DriveDeck-Setup-$env:DD_VERSION.exe", "dist/DriveDeck-Setup-$env:DD_VERSION.exe.blockmap", 'dist/latest.yml')
          foreach ($asset in $assets) { if (!(Test-Path $asset)) { throw "Missing update artifact: $asset" } }
          $release = gh release view $tag --repo $repo --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if (!(($release | ConvertFrom-Json).isDraft)) { throw 'This version is already published. Bump the version; published releases are never overwritten.' }
          } else {
            if ($repo -eq $env:GITHUB_REPOSITORY) {
              gh release create $tag --repo $repo --target $env:GITHUB_SHA --draft --title "DriveDeck $env:DD_VERSION" --notes-file $notesFile
            } else {
              gh release create $tag --repo $repo --draft --title "DriveDeck $env:DD_VERSION" --notes-file $notesFile
            }
            if ($LASTEXITCODE -ne 0) { throw 'Could not create draft release.' }
          }
          gh release edit $tag --repo $repo --notes-file $notesFile
          if ($LASTEXITCODE -ne 0) { throw 'Could not save release notes.' }
          gh release upload $tag @assets --repo $repo --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload release artifacts.' }
